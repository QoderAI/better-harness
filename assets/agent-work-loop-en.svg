<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="610" viewBox="0 305 2048 610" role="img" aria-labelledby="title desc">
  <title id="title">Agent Work Loop</title>
  <desc id="desc">A five-dimension Agent Work Loop covering Task Understanding, Controlled Execution, Change Validation, Reliable Delivery, and Learning Capture.</desc>
  <defs>
    <style>
      .cn, .latin { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .green { fill: #67c96c; }
      .line { fill: none; stroke: #67c96c; stroke-width: 4; }
      .icon { fill: none; stroke: #fff; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .stage-cn { fill: #fff; font-size: 36px; font-weight: 700; }
      .stage-en { fill: #67c96c; font-size: 22px; font-weight: 500; }
      .keywords { fill: #67c96c; font-size: 22px; font-weight: 500; }
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 10">
      <path d="M1,1 L10,5 L1,9" fill="none" stroke="#67c96c" stroke-width="2.4"/>
    </marker>
  </defs>

  <rect width="2048" height="1080" fill="#141414"/>

  <!-- Primary flow -->
  <path class="line" d="M402 385H757" marker-end="url(#arrow)"/>
  <path class="line" d="M847 385H1202" marker-end="url(#arrow)"/>
  <path class="line" d="M1292 385H1647" marker-end="url(#arrow)"/>

  <!-- Stage 1 -->
  <g transform="translate(357 385)">
    <circle r="45" fill="#4caf50" stroke="#2b2b2b" stroke-width="2"/>
    <g class="icon" transform="translate(-18 -20)">
      <path d="M18 0a13 13 0 0 0-8 23v7h16v-7A13 13 0 0 0 18 0Z"/>
      <path d="M12 30h12M13 36h10"/>
      <path d="M13 13c2 0 3 1 5 4 2-3 3-4 5-4"/>
    </g>
    <path class="line" d="M0 45V89"/>
  </g>
  <text x="357" y="520" class="latin stage-cn" text-anchor="middle">Task Understanding</text>
  <text x="357" y="580" class="latin keywords" text-anchor="middle">Rules · AGENTS.md · Spec · DESIGN.md</text>

  <!-- Stage 2 -->
  <g transform="translate(802 385)">
    <circle r="45" fill="#4caf50" stroke="#2b2b2b" stroke-width="2"/>
    <g class="icon" transform="translate(-24 -15)">
      <path d="M14 0 2 15l12 15M34 0l12 15-12 15M29-3 20 33"/>
    </g>
  </g>
  <text x="802" y="520" class="latin stage-cn" text-anchor="middle">Controlled Execution</text>
  <text x="802" y="580" class="latin keywords" text-anchor="middle">Skills · Commands · MCP tools · Sandbox</text>

  <!-- Stage 3 -->
  <g transform="translate(1247 385)">
    <circle r="45" fill="#4caf50" stroke="#2b2b2b" stroke-width="2"/>
    <g class="icon" transform="translate(-20 -22)">
      <path d="M11 0h18M15 0v11L2 41h36L25 11V0"/>
      <path d="M9 30h22"/>
    </g>
  </g>
  <text x="1247" y="520" class="latin stage-cn" text-anchor="middle">Change Validation</text>
  <text x="1247" y="580" class="latin keywords" text-anchor="middle">Tests · Lint · Hooks · Observability</text>

  <!-- Stage 4 -->
  <g transform="translate(1692 385)">
    <circle r="45" fill="#4caf50" stroke="#2b2b2b" stroke-width="2"/>
    <g class="icon" transform="translate(-21 -18)">
      <path d="M1 14 42 0 29 38 20 22 1 14Z"/>
      <path d="M20 22 42 0M20 22l-2 12"/>
    </g>
    <path class="line" d="M0 45V89"/>
  </g>
  <text x="1692" y="520" class="latin stage-cn" text-anchor="middle">Reliable Delivery</text>
  <text x="1692" y="580" class="latin keywords" text-anchor="middle">Review · Approval · CI/CD · Recovery</text>

  <!-- Return loop -->
  <path class="line" d="M1692 610V760H1072" marker-end="url(#arrow)"/>
  <path class="line" d="M976 760H357V610" marker-end="url(#arrow)"/>

  <!-- Learning Capture -->
  <g transform="translate(1024 760)">
    <circle r="42" fill="#67c96c"/>
    <g class="icon" transform="translate(-20 -20)">
      <circle cx="20" cy="5" r="4"/>
      <circle cx="5" cy="34" r="4"/>
      <circle cx="35" cy="34" r="4"/>
      <path d="M18 9 8 30M22 9l10 21M9 34h22"/>
    </g>
  </g>
  <text x="1024" y="830" class="latin" fill="#fff" font-size="36" font-weight="700" text-anchor="middle">Learning Capture</text>
  <text x="1024" y="868" class="latin" fill="#838280" font-size="20" text-anchor="middle">Detect → Engineer → Validate</text>
  <text x="1024" y="902" class="latin keywords" text-anchor="middle">Loop Discovery · SDLC Skills · Memory</text>
</svg>
