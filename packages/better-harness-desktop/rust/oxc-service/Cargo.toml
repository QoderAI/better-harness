[package]
name = "harness-oxc-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
oxc_allocator = "=0.147.0"
oxc_ast = { version = "=0.147.0", features = ["serialize"] }
oxc_ast_visit = { version = "=0.147.0", features = ["serialize"] }
oxc_parser = "=0.147.0"
oxc_span = "=0.147.0"
oxc_semantic = "=0.147.0"
oxc_transformer = "=0.147.0"
oxc_diagnostics = "=0.147.0"
oxc_codegen = "=0.147.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "thin"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSXPCConnection", "NSObject", "NSString", "NSData", "NSError", "NSSet", "NSRunLoop", "block2"] }
block2 = "0.6.2"

[build-dependencies]
cc = "1"
