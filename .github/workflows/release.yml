name: Publish npm

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        default: better-harness
        type: choice
        options:
          - better-harness
          - harness
          - harness-studio

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'QoderAI/better-harness'
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - name: Resolve npm dist-tag
        id: release
        run: node scripts/npm-package/npm-dist-tag.mjs "${{ inputs.package }}"
      - name: Publish Better Harness
        if: ${{ inputs.package == 'better-harness' }}
        run: npm publish --access public --tag "${{ steps.release.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish selected Harness workspace
        if: ${{ inputs.package != 'better-harness' }}
        run: npm publish --workspace "@qoder-ai/${{ inputs.package }}" --access public --tag "${{ steps.release.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
