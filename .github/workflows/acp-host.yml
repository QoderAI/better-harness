name: ACP Host

on:
  pull_request:
    paths:
      - 'packages/better-harness-desktop/rust/acp-host/**'
      - 'packages/harness/test/fixtures/acp-agent.mjs'
      - '.github/workflows/acp-host.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/better-harness-desktop/rust/acp-host/**'
      - 'packages/harness/test/fixtures/acp-agent.mjs'
      - '.github/workflows/acp-host.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acp-host-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The path fence and the terminal output ceiling behave differently per
  # platform (symlink resolution, path separators, process groups), so a POSIX
  # pass is not evidence for Windows. This job is the authoritative receipt.
  host:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      # The integration tests drive the shared TypeScript fixture agent so this
      # client is checked against an independent ACP implementation rather than
      # against its own assumptions. That needs Node and the workspace install.
      - uses: actions/setup-node@v6
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: cargo fmt --check
        working-directory: packages/better-harness-desktop/rust/acp-host
      - name: Test ACP host
        run: cargo test --locked
        working-directory: packages/better-harness-desktop/rust/acp-host
