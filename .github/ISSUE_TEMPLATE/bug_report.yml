name: Bug report
description: Report a reproducible Better Harness defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please keep the reproduction focused on the observable problem.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues for this problem.
          required: true

  - type: input
    id: version
    attributes:
      label: Better Harness version
      description: Use the installed package or plugin metadata. The current repository baseline is 0.3.0.
      placeholder: 0.3.0
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Claude Code
        - Codex
        - Qoder
        - Cursor
        - Standalone CLI
        - Other
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - npm package
        - IDE runtime ZIP or provisioned plugin
        - Source checkout
        - Other
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command or feature
      placeholder: better-harness report --no-sessions
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use the smallest repository or fixture that reproduces the problem.
      placeholder: |
        1. Start from ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      placeholder: Describe the observable success condition.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the smallest useful error or artifact excerpt.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Include relevant Node.js, npm, host versions, or focused test output.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Note regressions, workarounds, frequency, and whether the issue reproduces with `--no-sessions` when applicable.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I can submit a focused fix or fixture after the issue is triaged.
